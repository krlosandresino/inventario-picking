<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛠️ Admin - Reconteo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.18.0/firebase-app.js";
        import { getDatabase, ref, get, remove, onValue } from "https://www.gstatic.com/firebasejs/9.18.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBxLmlqxw7vNHGiI4mjljUGgZQ5a2VPXuA",
            authDomain: "inventariopicking.firebaseapp.com",
            databaseURL: "https://inventariopicking-default-rtdb.firebaseio.com",
            projectId: "inventariopicking",
            storageBucket: "inventariopicking.firebasestorage.app",
            messagingSenderId: "92946062722",
            appId: "1:92946062722:web:b9f379d04c1d1d42d1039b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const dbRefMaestro = ref(db, 'maestro');
        const dbRefRegistros1 = ref(db, 'registros');
        const dbRefReconteo = ref(db, 'registros_reconteo');

        let dataMaestro = {};
        let conteo1 = {};
        let conteo2 = {};
        
        let filtroEstadoReconteo = 'todos';

        window.validarAcceso = () => {
            const pass = document.getElementById('passLog').value;
            if (pass === "2026") { 
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminMain').style.display = 'block';
            } else { alert("Acceso Incorrecto"); }
        };

        onValue(dbRefMaestro, snap => {
            dataMaestro = {};
            (snap.val() || []).forEach(i => { if(i.cod) dataMaestro[i.cod] = i; });
            procesarTablaComparativa();
        });

        onValue(dbRefRegistros1, snap => {
            conteo1 = {};
            const d = snap.val() || {};
            for(let k in d) {
                if(!conteo1[d[k].cod]) conteo1[d[k].cod] = 0;
                conteo1[d[k].cod] += parseFloat(d[k].cant || 0);
            }
            procesarTablaComparativa();
        });

        onValue(dbRefReconteo, snap => {
            conteo2 = {};
            const d = snap.val() || {};
            for(let k in d) {
                if(!conteo2[d[k].cod]) conteo2[d[k].cod] = { cant: 0, usuarios: new Set(), keys: [] };
                conteo2[d[k].cod].cant += parseFloat(d[k].cant || 0);
                conteo2[d[k].cod].usuarios.add(d[k].usuario);
                conteo2[d[k].cod].keys.push(k);
            }
            procesarTablaComparativa();
        });

        function procesarTablaComparativa() {
            if(Object.keys(dataMaestro).length === 0) return;
            
            let descuadradosData = [];
            let reconteosCompletados = 0;

            for (let cod in conteo1) {
                let fisico1 = conteo1[cod];
                let maestroItem = dataMaestro[cod];
                
                if (maestroItem) {
                    let teorico = parseFloat(maestroItem.stock || 0);
                    if (fisico1 !== teorico) {
                        let reconteoObj = conteo2[cod];
                        let fisico2 = reconteoObj ? reconteoObj.cant : "-";
                        let difFinal = reconteoObj ? (fisico2 - teorico) : "-";
                        let userReconteo = reconteoObj ? Array.from(reconteoObj.usuarios).join(', ') : "Pendiente";
                        
                        if(reconteoObj) reconteosCompletados++;

                        descuadradosData.push({
                            cod: cod, pos: maestroItem.pos,
                            teorico: teorico,
                            fisico1: fisico1, dif1: fisico1 - teorico,
                            fisico2: fisico2, difFinal: difFinal,
                            usuario: userReconteo
                        });
                    }
                }
            }

            document.getElementById('totalDescuadre').innerText = descuadradosData.length;
            document.getElementById('totalRecontado').innerText = reconteosCompletados;

            document.getElementById('bodyMonitor').innerHTML = descuadradosData.map(reg => {
                let colorDif1 = reg.dif1 === 0 ? '#2ec4b6' : (reg.dif1 < 0 ? '#e71d36' : '#4361ee');
                let colorDif2 = reg.difFinal === "-" ? '#888' : (reg.difFinal === 0 ? '#2ec4b6' : (reg.difFinal < 0 ? '#e71d36' : '#4361ee'));
                
                return `
                    <tr>
                        <td style="user-select: text; cursor: text;" title="Seleccionar código"><b>${reg.cod}</b></td>
                        <td style="user-select: text; cursor: text;" title="Seleccionar ubicación"><b style="color:#4361ee">${reg.pos}</b></td>
                        <td align="center">${reg.teorico}</td>
                        <td align="center" style="background:#fef2f2;">${reg.fisico1} <small style="color:${colorDif1}">(${reg.dif1 > 0 ? '+'+reg.dif1 : reg.dif1})</small></td>
                        <td align="center" style="background:#eff6ff; font-weight:bold;">${reg.fisico2}</td>
                        <td align="center" style="color:${colorDif2}; font-weight:bold;">${reg.difFinal > 0 ? '+'+reg.difFinal : reg.difFinal}</td>
                        <td><span class="${reg.usuario === 'Pendiente' ? 'badge-pendiente' : 'user-pill'}">${reg.usuario}</span></td>
                        <td align="center">
                            ${reg.fisico2 !== "-" ? `<button class="btn-action-delete" onclick="eliminarReconteo('${reg.cod}')" title="Borrar Reconteo">🗑️</button>` : ''}
                        </td>
                    </tr>`;
            }).join('');

            ejecutarFiltro(); 
        }

        window.eliminarReconteo = async (codigo) => {
            if(confirm(`¿Deseas eliminar el RECONTEO del código ${codigo}? (No afectará el primer conteo)`)) {
                let reconteoObj = conteo2[codigo];
                if(reconteoObj) {
                    for(let key of reconteoObj.keys) {
                        await remove(ref(db, `registros_reconteo/${key}`));
                    }
                }
            }
        };

        window.setFiltroEstadoReconteo = (estado) => {
            filtroEstadoReconteo = filtroEstadoReconteo === estado ? 'todos' : estado; 
            
            document.querySelectorAll('.mini-card').forEach(c => c.style.opacity = '1');
            if (filtroEstadoReconteo !== 'todos') {
                document.querySelectorAll('.mini-card').forEach(c => {
                    if (!c.classList.contains('mc-' + estado)) c.style.opacity = '0.4';
                });
            }
            ejecutarFiltro();
        };

        window.ejecutarFiltro = () => {
            const term = document.getElementById('busquedaRealTime').value.toLowerCase();
            const filas = document.querySelectorAll('#bodyMonitor tr');
            
            filas.forEach(fila => {
                const textoFila = fila.innerText.toLowerCase();
                let cumpleEstado = true;
                
                const celdas = fila.querySelectorAll('td');
                if (celdas.length >= 7) {
                    const difFinalText = celdas[5].innerText.trim();
                    
                    if (filtroEstadoReconteo === 'resueltos') {
                        if (difFinalText !== "0" && difFinalText !== "+0" && difFinalText !== "-0") {
                            cumpleEstado = false;
                        }
                    } else if (filtroEstadoReconteo === 'confirmados') {
                        if (difFinalText === "0" || difFinalText === "+0" || difFinalText === "-0" || difFinalText === "-") {
                            cumpleEstado = false;
                        }
                    }
                }

                fila.style.display = (textoFila.includes(term) && cumpleEstado) ? "" : "none";
            });
        };

        window.copiarTablaExcel = () => {
            const filas = document.querySelectorAll('#bodyMonitor tr');
            let textoCopiar = "Código\tUbicación\tStock\t1er Conteo\tReconteo Final\tDif. Final\tOperador Reconteo\n";
            
            filas.forEach(fila => {
                if (fila.style.display !== "none") {
                    const celdas = fila.querySelectorAll('td');
                    if (celdas.length >= 7) {
                        const codigo = celdas[0].innerText.trim();
                        const ubicacion = celdas[1].innerText.trim();
                        const teorico = celdas[2].innerText.trim();
                        const conteo1 = celdas[3].innerText.trim().replace(/\n/g, ' ').replace(/\s+/g, ' '); 
                        const conteo2 = celdas[4].innerText.trim();
                        const difFinal = celdas[5].innerText.trim();
                        const operador = celdas[6].innerText.trim();
                        
                        textoCopiar += `${codigo}\t${ubicacion}\t${teorico}\t${conteo1}\t${conteo2}\t${difFinal}\t${operador}\n`;
                    }
                }
            });

            navigator.clipboard.writeText(textoCopiar).then(() => {
                alert("¡Tabla copiada! Ya puedes pegarla.");
            }).catch(err => {
                alert("Error al copiar los datos: " + err);
            });
        };

        window.borrarTodoReconteo = async () => {
            if(confirm("⚠️ ¿DESEAS BORRAR TODO EL HISTORIAL DE RECONTEOS?\n\nEsto dejará en blanco la columna 'Reconteo Final'.\nTranquilo, tu 1er conteo NO se verá afectado.")) {
                await remove(dbRefReconteo);
                alert("Todos los datos de reconteo fueron limpiados correctamente.");
            }
        };
    </script>
    <style>
        :root { --primary: #4361ee; --bg: #f4f7fe; --danger: #e71d36; --success: #2ec4b6; --warning: #f9ab00; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 20px; user-select: none; }
        #loginOverlay { position: fixed; inset: 0; background: linear-gradient(135deg, #1e293b, #0f172a); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-card { background: white; padding: 40px; border-radius: 20px; text-align: center; width: 300px; }
        .login-card input { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; text-align:center;}
        .btn-login { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        
        .header { background: white; padding: 25px; border-radius: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); flex-wrap: wrap; gap: 10px;}
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 20px; border-radius: 15px; text-align: center; border-bottom: 6px solid var(--danger); }
        .stat-card h2 { margin: 5px 0 0 0; font-size: 2.5rem; }
        
        .section { background: white; border-radius: 15px; padding: 25px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;}
        
        table { width: 100%; border-collapse: collapse; }
        th { background: #f9fafb; padding: 12px; text-align: left; color: #555; border-bottom: 2px solid #eee; font-size: 0.85rem; position: sticky; top: 0;}
        td { padding: 12px; border-bottom: 1px solid #f0f0f0; font-size: 0.9rem; }
        
        .user-pill { background: #eef2ff; color: var(--primary); padding: 4px 10px; border-radius: 15px; font-weight: bold; font-size: 0.75rem; }
        .badge-pendiente { background: #fff4cc; color: var(--warning); padding: 4px 10px; border-radius: 15px; font-weight: bold; font-size: 0.75rem; }
        .btn-action-delete { background: none; border: none; cursor: pointer; font-size: 1.1rem; }
        .scroll { max-height: 600px; overflow-y: auto; }
        
        .btn-danger-main { background: var(--danger); color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .btn-danger-main:hover { background: #c9182b; }
        .btn-copy-excel { background: #15803d; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; gap: 6px; }
        .btn-copy-excel:hover { background: #166534; }
        .search-input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #eee; border-radius: 10px; font-family: 'Inter', sans-serif; outline: none; transition: border 0.3s; box-sizing: border-box;}
        .search-input:focus { border-color: var(--primary); }
        
        /* --- ESTILOS MINI DASHBOARD RECONTEO --- */
        .mini-dashboard { display: flex; gap: 10px; margin-bottom: 15px; }
        .mini-card { flex: 1; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 0.85rem; cursor:pointer; transition: opacity 0.3s; }
        .mc-resueltos { background: #e6f9f7; color: var(--success); border: 1px solid #c0f0eb; }
        .mc-confirmados { background: #fff4cc; color: var(--warning); border: 1px solid #ffe680; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <h2 style="color:var(--primary)">Auditoría Reconteo</h2>
        <input type="password" id="passLog" placeholder="Clave Admin">
        <button class="btn-login" onclick="validarAcceso()">ENTRAR</button>
    </div>
</div>

<div id="adminMain" style="display:none;">
    <div class="header">
        <h2 style="margin:0;">📊 Panel de Control: Reconteo</h2>
        <button class="btn-danger-main" onclick="borrarTodoReconteo()">🗑️ ELIMINAR TODO EL RECONTEO</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <span style="color:#666; font-weight:bold; font-size:0.8rem">TOTAL DESCUADRADOS (1er Conteo)</span>
            <h2 id="totalDescuadre" style="color:var(--danger)">0</h2>
        </div>
        <div class="stat-card" style="border-color: var(--success);">
            <span style="color:#666; font-weight:bold; font-size:0.8rem">CÓDIGOS YA RECONTADOS</span>
            <h2 id="totalRecontado" style="color:var(--success)">0</h2>
        </div>
    </div>

    <div class="section">
        <div class="section-header">
            <h3 style="margin:0;">Comparativa de Auditoría</h3>
            <button class="btn-copy-excel" onclick="copiarTablaExcel()">📋 Copiar para Excel</button>
        </div>
        
        <div class="mini-dashboard">
            <div class="mini-card mc-resueltos" onclick="setFiltroEstadoReconteo('resueltos')" title="Filtrar Descuadres Resueltos">✅ Descuadre Resuelto</div>
            <div class="mini-card mc-confirmados" onclick="setFiltroEstadoReconteo('confirmados')" title="Filtrar Descuadres Confirmados">⚠️ Descuadre Confirmado</div>
        </div>
        
        <input type="text" id="busquedaRealTime" class="search-input" placeholder="🔍 Buscar por código, ubicación o usuario..." oninput="ejecutarFiltro()">

        <div class="scroll">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Ubicación</th>
                        <th style="text-align:center;">Stock</th>
                        <th style="text-align:center; background:#fef2f2;">1er Conteo (Registros)</th>
                        <th style="text-align:center; background:#eff6ff;">Reconteo Final</th>
                        <th style="text-align:center;">Dif. Final</th>
                        <th>Operador Reconteo</th>
                        <th style="text-align:center;">Acción</th>
                    </tr>
                </thead>
                <tbody id="bodyMonitor"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    document.getElementById('passLog').addEventListener('keydown', (e) => { if(e.key === 'Enter') validarAcceso(); });
</script>
</body>
</html>
